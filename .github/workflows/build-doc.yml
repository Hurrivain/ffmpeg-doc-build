name: Build FFmpeg Docs

on:
  workflow_dispatch:

jobs:
  build-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo perl nasm
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo perl
      - name: Make scripts executable
        run: |
          chmod +x configure
          find . -name "*.sh" -exec chmod +x {} \;
      - name: Configure
        run: ./configure

      - name: Build docs
        run: make doc

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-doc-html
          path: doc/*.html
          retention-days: 30
